<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <style>
        table {
            border: 2px solid red;
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid green;
            text-align: center;
            padding: 8px;
        }

        h2 {
            text-align: center;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <h2>List of Products</h2>

    <table>
        <thead>
            <tr>
                <th>Sr. No.</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>
        </thead>

        <tbody id="data"></tbody>
    </table>

    <script>
        const URL = "https://dummyjson.com/products?limit=1000&skip=2";

        async function loadproducts() {
            try {
                const res = await fetch(URL);
                const data = await res.json();

                let rows = "";

                data.products.map((i, index) => {
                    rows += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${i.title}</td>
                            <td>
                                <img src="${i.images[0]}" alt="${i.title}">
                            </td>
                            <td>${i.category}</td>
                            <td>${i.rating}</td>
                            <td>${i.price}</td>
                            <td>${i.stock}</td>
                        </tr>
                    `;
                });

                document.getElementById("data").innerHTML = rows;
            }
            catch (err) {
                console.log("Error:", err);
            }
        }

        loadproducts();
    </script>

</body>
</html>
