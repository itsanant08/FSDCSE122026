<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        table {
            border: 2px solid red;
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid green;
            text-align: center;
            padding: 8px;
        }

        img {
            width: 80px;
            height: 80px;
        }

        button {
            padding: 8px;
            background: green;
            color: white;
            border: 0;
        }
    </style>
</head>

<body>

<h2 align="center">List of Products</h2>

<table>
    <tr>
        <th>Sr. No.</th>
        <th>Title</th>
        <th>Image</th>
        <th>Category</th>
        <th>Rating</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Cart</th>
    </tr>

    <tbody id="data"></tbody>
</table>

<script>
const productURL = "https://dummyjson.com/products?limit=100";

async function loadProducts() {
    try {
        const response = await fetch(productURL);
        const data = await response.json();

        let rows = "";

        data.products.forEach((p, i) => {
            rows += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${p.title}</td>
                    <td><img src="${p.images[0]}"></td>
                    <td>${p.category}</td>
                    <td>${p.rating}</td>
                    <td>₹${(p.price * 88).toFixed(2)}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button onclick="addToCart(${p.id})">
                            Add to cart
                        </button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("data").innerHTML = rows;

    } catch (error) {
        console.log(error);
        document.getElementById("data").innerHTML =
            "<tr><td colspan='8'>Failed to load products</td></tr>";
    }
}

function addToCart(id) {
    alert("Product " + id + " added to cart!");
}

loadProducts();
</script>

</body>
</html>
